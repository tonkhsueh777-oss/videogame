<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#050506">
  <title>剑影魔踪 · 互动影片</title>
  <link rel="stylesheet" href="./styles.css?v=mobile-stream-4">
</head>
<body>
  <main id="app" class="app-shell" aria-label="武侠互动影片">
    <section id="stage" class="stage">
      <video
        id="scene-video"
        class="scene-video"
        playsinline
        webkit-playsinline
        preload="metadata"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate nofullscreen"
      ></video>

      <canvas id="frozen-frame" class="frozen-frame" aria-hidden="true"></canvas>
      <div class="cinematic-shade" aria-hidden="true"></div>
      <div class="combat-flash" aria-hidden="true"></div>
      <div class="impact-slash" aria-hidden="true"></div>
      <div class="seal-wave" aria-hidden="true"></div>
      <p id="combat-result" class="combat-result" role="status" hidden></p>

      <section id="enter-screen" class="enter-screen overlay-visible" aria-label="开始游戏">
        <h1>剑影魔踪</h1>
        <p class="enter-subtitle">一念之间，决定生死</p>
        <button id="enter-button" class="enter-button" type="button">
          <span class="enter-line" aria-hidden="true"></span>
          <span>进入战局</span>
          <span class="enter-line" aria-hidden="true"></span>
        </button>
        <p>建议佩戴耳机体验</p>
      </section>

      <section id="choices" class="choices interaction-layer" aria-hidden="true" aria-label="战斗操作">
        <canvas id="slash-trail" class="slash-trail" aria-hidden="true"></canvas>
        <div class="combat-zone">
        <p id="choice-prompt" class="choice-prompt"></p>
        <div id="choice-buttons" class="choice-buttons"></div>
        <p class="gesture-help">顺势划动 · 亦可轻点招式</p>
        </div>
      </section>

      <section id="ending-panel" class="ending-panel" aria-hidden="true">
        <p class="ending-kicker">此局已定</p>
        <h1 id="ending-title">结局</h1>
        <div class="ending-actions">
          <button id="restart-button" class="action-button primary" type="button">重新挑战</button>
          <button id="back-button" class="action-button secondary" type="button">返回上一个选择</button>
        </div>
      </section>

      <section id="loading-panel" class="loading-panel" aria-hidden="true" role="status" aria-live="polite">
        <span class="loading-sigil" aria-hidden="true">剑</span>
        <p id="loading-message">命运正在改变……</p>
        <progress id="loading-progress" max="100" aria-label="影片缓冲进度"></progress>
        <button id="loading-retry" class="action-button secondary" type="button" hidden>重新连接当前影片</button>
      </section>
      <section id="continue-panel" class="continue-panel" aria-hidden="true"><button id="continue-button" class="action-button primary" type="button">点击继续播放</button></section>

      <section id="error-panel" class="error-panel" aria-hidden="true" role="alert">
        <p id="error-message">影片载入失败，请重新尝试。</p>
        <button id="error-retry" class="action-button primary" type="button">重新载入</button>
        <button id="error-restart" class="action-button secondary" type="button" hidden>重新开始</button>
      </section>

      <div id="rotate-hint" class="rotate-hint" aria-hidden="true">
        <div class="rotate-phone" aria-hidden="true"></div>
        <strong>请旋转手机，使用竖屏体验</strong>
      </div>
    </section>
  </main>
  <script src="./app.js?v=mobile-stream-4"></script>
</body>
</html>
